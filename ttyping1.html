  <!-- مكتبة Tailwind CSS للتنسيق الجمالي السريع -->

  <style>

    body {

</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4 crt-screen">

  <!-- ================= 1. القائمة الرئيسية (Menu) ================= -->
  <div id="screen-menu" class="w-full max-w-xl border-4 border-green-500 bg-black/90 p-6 sm:p-8 rounded-2xl shadow-[0_0_30px_rgba(34,197,94,0.3)] text-center">
    <div class="inline-block p-3 border-2 border-green-500 rounded-full mb-4 animate-pulse">
      <svg class="w-12 h-12 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>

    <h1 class="text-3xl sm:text-5xl font-black mb-2 tracking-wide neon-text">مدرب الطباعة</h1>
    <p class="text-green-600 text-sm sm:text-base mb-6 font-bold">النسخة الكلاسيكية المستوحاة من برامج التسعينات</p>

    <!-- اختيار السرعة -->
    <div class="mb-6 bg-green-950/40 p-4 border border-green-800 rounded-xl">

        <button onclick="setSpeed('normal')" id="spd-normal" class="speed-btn border-2 border-green-800 text-green-500 hover:border-green-500 py-2 rounded-lg font-bold text-sm transition-all">🚶 بطيء مريح</button>
        <button onclick="setSpeed('fast')" id="spd-fast" class="speed-btn border-2 border-green-800 text-green-500 hover:border-green-500 py-2 rounded-lg font-bold text-sm transition-all">⚡ سريع</button>

        <span>⌨️</span> طباعة الكلمات العربية
      </button>
      <button onclick="startGame('english')" class="w-full border-2 border-green-500 hover:bg-green-500 hover:text-black py-3.5 px-6 rounded-xl transition-all font-bold text-xl flex items-center justify-center gap-3">
        <span>🔤</span> طباعة الكلمات الإنجليزية
      </button>
    </div>

  <!-- ================= 2. شاشة اللعب (Gameplay) ================= -->
  <div id="screen-game" class="w-full max-w-4xl h-[90vh] border-2 border-green-600 bg-black/95 rounded-2xl flex-col shadow-[inset_0_0_40px_rgba(34,197,94,0.15)] relative hidden">
    
    <!-- الشريط العلوي -->
    <div class="flex justify-between items-center px-6 py-4 border-b border-green-900 bg-gray-950/80 rounded-t-2xl">
      <div class="text-xl sm:text-2xl font-bold flex items-center gap-2">

      </div>

        <span class="heart text-red-500">❤️</span>
        <span class="heart text-red-500">❤️</span>
        <span class="heart text-red-500">❤️</span>
      </div>
    </div>

    <!-- ساحة هبوط الكلمات -->
    <div id="game-area" class="flex-1 relative overflow-hidden w-full"></div>

    <!-- شريط الإدخال ومؤشر الكتابة السفلي -->
    <div class="p-4 border-t border-green-900 bg-black flex items-center justify-center gap-3 rounded-b-2xl">
      <span class="text-green-500 text-2xl font-bold animate-pulse">&gt;</span>
      <div class="h-14 min-w-[240px] px-4 bg-gray-950 border-2 border-green-700 rounded-xl flex items-center justify-center text-3xl font-bold tracking-widest text-yellow-400 shadow-[inset_0_0_10px_rgba(0,0,0,1)]">
        <span id="input-display" class="text-yellow-400"></span>
        <span class="w-3 h-7 bg-green-500 mx-1 animate-ping inline-block"></span>
      </div>

  <!-- ================= 3. شاشة انتهاء اللعبة (Game Over) ================= -->
  <div id="screen-gameover" class="w-full max-w-md border-4 border-red-600 bg-black/95 p-8 rounded-2xl shadow-[0_0_40px_rgba(220,38,38,0.5)] text-center hidden">
    <h2 class="text-5xl font-black text-red-500 mb-4 tracking-widest">انتهت اللعبة</h2>
    <p class="text-xl text-gray-400 mb-2">مجموع نقاطك التي حققتها:</p>
    <div id="final-score" class="text-6xl font-black text-yellow-400 mb-8">0</div>
    
    <button onclick="goToMenu()" class="w-full border-2 border-green-500 text-green-400 hover:bg-green-500 hover:text-black py-4 px-6 rounded-xl transition-all font-bold text-2xl flex items-center justify-center gap-3">
      <span>🔄</span> العودة للقائمة الرئيسية
    </button>
  </div>

  <!-- ================= المنطق البرمجي للعبة (JavaScript) ================= -->
  <script>
    // قائمة الكلمات
    const ARABIC_WORDS = ["مرحبا", "برمجة", "حاسوب", "تطور", "نجاح", "شمس", "قمر", "كتاب", "عالم", "سرعة", "دقة", "لوحة", "مفاتيح", "تفكير", "ابداع", "تعليم", "مستقبل", "علم", "ذكاء", "سماء"];
    const ENGLISH_WORDS = ["hello", "world", "code", "fast", "type", "game", "retro", "computer", "logic", "smart", "focus", "skill", "keyboard", "screen", "pixel", "byte"];

    // إعدادات السرعة المريحة
    const SPEED_CONFIG = {
      easy:   { dropSpeed: 0.035, spawnInterval: 2800 },
      normal: { dropSpeed: 0.065, spawnInterval: 2100 },
      fast:   { dropSpeed: 0.11,  spawnInterval: 1400 }
    };

    let selectedSpeed = 'easy';
    let currentMode = 'math';
    let score = 0;
    let lives = 3;
    let entities = [];
    let activeTargetId = null;
    let currentInput = "";
    let isRunning = false;
    let animFrameId = null;
    let lastSpawnTime = 0;

    // === محرك الصوت 8-bit (Web Audio API) ===
    function playSound(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch (e) {}
    }

    // === تحديد السرعة ===
    function setSpeed(spd) {
      selectedSpeed = spd;
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.classList.remove('border-green-500', 'bg-green-500', 'text-black');
        btn.classList.add('border-green-800', 'text-green-500');
      });
      const activeBtn = document.getElementById('spd-' + spd);
      activeBtn.classList.remove('border-green-800', 'text-green-500');
      activeBtn.classList.add('border-green-500', 'bg-green-500', 'text-black');
    }

    // === بدء اللعبة ===
    function startGame(mode) {
      currentMode = mode;
      score = 0;
      lives = 3;
      entities = [];
      activeTargetId = null;
      currentInput = "";
      
      document.getElementById('screen-menu').classList.add('hidden');
      document.getElementById('screen-gameover').classList.add('hidden');
      const gameScreen = document.getElementById('screen-game');
      gameScreen.classList.remove('hidden');
      gameScreen.classList.add('flex');

      // ضبط اتجاه لوحة اللعب
      const gameArea = document.getElementById('game-area');
      gameArea.dir = mode === 'english' ? 'ltr' : 'rtl';

      updateHUD();
      isRunning = true;
      lastSpawnTime = performance.now();
      animFrameId = requestAnimationFrame(gameLoop);
    }

    // === توليد عنصر جديد ===
    function spawnEntity() {
      let text = '';
      let answer = '';

      if (currentMode === 'math') {
        const ops = ['+', '-', '*'];
        const op = ops[Math.floor(Math.random() * ops.length)];
        const n1 = Math.floor(Math.random() * 10) + 1;
        const n2 = Math.floor(Math.random() * 10) + 1;
        if (op === '+') { answer = (n1 + n2).toString(); text = `${n1} + ${n2}`; }
        else if (op === '-') { 
          const max = Math.max(n1, n2);
          const min = Math.min(n1, n2);
          answer = (max - min).toString(); 
          text = `${max} - ${min}`; 
        }
        else if (op === '*') { answer = (n1 * n2).toString(); text = `${n1} * ${n2}`; }
      } else if (currentMode === 'arabic') {
        text = ARABIC_WORDS[Math.floor(Math.random() * ARABIC_WORDS.length)];
        answer = text;
      } else if (currentMode === 'english') {
        text = ENGLISH_WORDS[Math.floor(Math.random() * ENGLISH_WORDS.length)];
        answer = text;
      }

      const entity = {
        id: 'ent_' + Math.random().toString(36).substr(2, 9),
        text: text,
        answer: answer,
        x: Math.floor(Math.random() * 65) + 10, // نسبة أفقية
        y: -10, // من أعلى
        speed: SPEED_CONFIG[selectedSpeed].dropSpeed
      };

      entities.push(entity);
    }

    // === حلقة اللعبة المستمرة ===
    function gameLoop(currentTime) {
      if (!isRunning) return;

      // توليد عناصر بفاصل زمني
      if (currentTime - lastSpawnTime > SPEED_CONFIG[selectedSpeed].spawnInterval) {
        spawnEntity();
        lastSpawnTime = currentTime;
      }

      // تحريك العناصر وتحديث مواضعها
      let lostLife = false;
      for (let i = entities.length - 1; i >= 0; i--) {
        entities[i].y += entities[i].speed;

        // إذا سقطت الكلمة وتجاوزت الحد السفلي
        if (entities[i].y > 88) {
          lostLife = true;
          if (activeTargetId === entities[i].id) {
            activeTargetId = null;
            currentInput = "";
          }
          entities.splice(i, 1);
        }
      }

      if (lostLife) {
        lives--;
        playSound('error');
        updateHUD();
        if (lives <= 0) {
          gameOver();
          return;
        }
      }

      renderEntities();
      animFrameId = requestAnimationFrame(gameLoop);
    }

    // === رسم الكلمات على الشاشة وتطبيق التصويب الذكي ===
    function renderEntities() {
      const gameArea = document.getElementById('game-area');
      gameArea.innerHTML = '';

      entities.forEach(entity => {
        const isTargeted = activeTargetId === entity.id;
        const hasTarget = activeTargetId !== null;

        const el = document.createElement('div');
        el.className = `absolute whitespace-nowrap text-2xl sm:text-3xl font-black rounded-lg transition-all duration-75 ${isTargeted ? 'target-box px-3 py-1 z-20' : 'px-2 py-1 z-10'}`;
        
        if (currentMode === 'english') {
          el.style.left = entity.x + '%';
        } else {
          el.style.right = entity.x + '%';
        }
        el.style.top = entity.y + '%';
        
        // إخفاء/تعتيم الكلمات الأخرى عند التصويب
        el.style.opacity = (hasTarget && !isTargeted) ? '0.15' : '1';

        // تظليل الجزء المكتوب
        if (isTargeted && currentInput.length > 0) {
          const typed = entity.answer.substring(0, currentInput.length);
          const remaining = entity.answer.substring(currentInput.length);
          el.innerHTML = `<span class="text-yellow-300 underline font-extrabold">${typed}</span><span class="text-green-400">${remaining}</span>`;
        } else {
          el.innerHTML = `<span class="text-green-400">${entity.text}</span>`;
        }

        gameArea.appendChild(el);
      });
    }

    // === استقبال ضغطات لوحة المفاتيح ===
    window.addEventListener('keydown', (e) => {
      if (!isRunning) return;

      // تجاهل أزرار التحكم
      if (['Shift', 'Control', 'Alt', 'Meta', 'Tab', 'CapsLock'].includes(e.key)) return;

      if (e.key === 'Escape') {
        goToMenu();
        return;
      }

      if (e.key === 'Backspace') {
        currentInput = currentInput.slice(0, -1);
        if (currentInput === "") {
          activeTargetId = null; // فك القفل إذا مسح كل شيء
        }
        updateHUD();
        return;
      }

      const nextInput = currentInput + e.key;

      if (activeTargetId) {
        // إذا كان هناك هدف محدد بالفعل
        const target = entities.find(t => t.id === activeTargetId);
        if (target && target.answer.startsWith(nextInput)) {
          currentInput = nextInput;
          if (target.answer === nextInput) {
            // إكمال الكلمة بنجاح
            playSound('success');
            score += 10;
            entities = entities.filter(t => t.id !== target.id);
            activeTargetId = null;
            currentInput = "";
          }
        } else {
          playSound('error'); // حرف خاطئ
        }
      } else {
        // البحث عن هدف جديد يبدأ بهذا الحرف
        const candidates = entities.filter(t => t.answer.startsWith(nextInput));
        if (candidates.length > 0) {
          // اختيار الأقرب للأرض (الأكبر في Y)
          const chosen = candidates.reduce((a, b) => a.y > b.y ? a : b);
          activeTargetId = chosen.id;
          currentInput = nextInput;
          
          if (chosen.answer === nextInput) {
            playSound('success');
            score += 10;
            entities = entities.filter(t => t.id !== chosen.id);
            activeTargetId = null;
            currentInput = "";
          }
        } else {
          playSound('error');
        }
      }

      updateHUD();
    });

    // === تحديث الواجهة ===
    function updateHUD() {
      document.getElementById('score-display').innerText = score;
      document.getElementById('input-display').innerText = currentInput;

      // تحديث القلوب
      const hearts = document.querySelectorAll('#lives-display .heart');
      hearts.forEach((h, index) => {
        h.style.opacity = index < lives ? '1' : '0.15';
      });
    }

    // === نهاية اللعبة ===
    function gameOver() {
      isRunning = false;
      cancelAnimationFrame(animFrameId);
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('flex');
      document.getElementById('final-score').innerText = score;
      document.getElementById('screen-gameover').classList.remove('hidden');
    }

    // === العودة للقائمة ===
    function goToMenu() {
      isRunning = false;
      cancelAnimationFrame(animFrameId);
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('flex');
      document.getElementById('screen-gameover').classList.add('hidden');
      document.getElementById('screen-menu').classList.remove('hidden');
    }
  </script>
</body>
</html>
