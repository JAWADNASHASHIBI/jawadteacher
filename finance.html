<title>مبلغ القرض</title>
<script type="text/javascript"   charset="utf-8" language="javascript">
function result()
{

var l=document.getElementById('T1').value;
var i=document.getElementById('T2').value;
var t=document.getElementById('T3').value;
var fe=document.getElementById('T4').value;



document.getElementById('T4').readOnly=true;
var fe=Math.pow(1+i,t);
var fev=fe-1;
var n=fev.toFixed(5);
var f=l*fev;
var fv=l+f;
document.getElementById('T4').value=n;
document.getElementById('T5').value=f;
document.getElementById('T6').value=fv;

}
</script>
