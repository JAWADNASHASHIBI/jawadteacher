<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="copyright" content="(c) Jawad Nashashibi - CC BY-NC 4.0 - not for sale">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقات رحلة الصف الأول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdf2f8; /* خلفية زهرية فاتحة جداً */
        }
        
        /* تنسيقات الطباعة */
        @media print {
            body {
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            #cards-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 15px;
                padding: 0;
            }
            .card {
                page-break-inside: avoid; /* منع انقسام البطاقة بين صفحتين */
                border: 2px dashed #f472b6 !important;
                box-shadow: none !important;
                width: 45%; /* بطاقتين في كل صف تقريباً */
                margin-bottom: 20px;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        /* زينة البطاقة */
        .card-bg {
            background-image: radial-gradient(#fbcfe8 10%, transparent 10%);
            background-position: 0 0;
            background-size: 20px 20px;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- قسم الإدخال (لا يظهر في الطباعة) -->
    <div class="no-print max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 mb-8 border-t-8 border-pink-400">
        <h1 class="text-3xl font-bold text-center text-pink-600 mb-6">🚌 صانع بطاقات الرحلة المدرسية ✨</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">اسم المدرسة</label>
                <input type="text" id="schoolName" value="مدرسة شعفاط الأساسية للبنات أ" class="w-full border-gray-300 rounded-lg shadow-sm p-3 border focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">رقم هاتف المربية / الطوارئ</label>
                <input type="text" id="phoneNumber" value="0547409095" dir="ltr" class="w-full border-gray-300 text-right rounded-lg shadow-sm p-3 border focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none">
            </div>
            <div class="md:col-span-2">
                <label class="block text-gray-700 font-semibold mb-2">أسماء الطالبات (اسم واحد في كل سطر)</label>
                <textarea id="studentNames" rows="5" placeholder="مثال:&#10;فاطمة أحمد&#10;ليان محمود&#10;نور علي&#10;(اتركيه فارغاً لطباعة بطاقات بدون أسماء)" class="w-full border-gray-300 rounded-lg shadow-sm p-3 border focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none"></textarea>
            </div>
            <div class="md:col-span-2 text-sm text-gray-500">
                * ملاحظة: إذا تركتِ مربع الأسماء فارغاً، سيتم إنشاء 8 بطاقات فارغة لملئها يدوياً.
            </div>
        </div>

        <div class="flex flex-wrap gap-4 justify-center">
            <button onclick="generateCards()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-200 flex items-center gap-2">
                <span>✨ إنشاء البطاقات</span>
            </button>
            <button onclick="window.print()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-200 flex items-center gap-2">
                <span>🖨️ طباعة</span>
            </button>
        </div>
    </div>

    <!-- حاوية البطاقات (تظهر في الطباعة) -->
    <div id="cards-container" class="flex flex-wrap justify-center gap-6 max-w-6xl mx-auto">
        <!-- سيتم إضافة البطاقات هنا عبر الجافاسكريبت -->
    </div>

    <script>
        function createCardHTML(name, school, phone) {
            return `
                <div class="card card-bg relative w-full sm:w-80 h-48 rounded-2xl border-2 border-pink-200 shadow-md overflow-hidden flex flex-col items-center justify-center p-4">
                    <!-- تصميم الشريط العلوي -->
                    <div class="absolute top-0 left-0 w-full h-8 bg-pink-400 flex items-center justify-center">
                        <span class="text-white text-sm font-bold tracking-wider">رحلة مدرسية سعيدة 🎒🎈</span>
                    </div>
                    
                    <div class="mt-6 w-full text-center z-10">
                        <h2 class="text-2xl font-bold text-gray-800 mb-1 border-b-2 border-dashed border-gray-300 pb-1 h-10 overflow-hidden flex items-end justify-center">
                            ${name || '<span class="text-gray-300 text-sm">....................................</span>'}
                        </h2>
                        <p class="text-pink-600 font-bold text-lg mb-1">الصف الأول</p>
                        
                        <div class="bg-white/80 rounded-lg p-2 mt-2 text-sm border border-pink-100">
                            <p class="text-gray-700 font-semibold truncate flex items-center justify-center gap-1">
                                🏫 <span>${school}</span>
                            </p>
                            <p class="text-gray-700 font-bold mt-1 flex items-center justify-center gap-1" dir="ltr">
                                📞 <span>${phone}</span>
                            </p>
                        </div>
                    </div>
                    
                    <!-- أشكال زينة -->
                    <div class="absolute -bottom-2 -left-2 text-3xl opacity-20 transform -rotate-12">🌸</div>
                    <div class="absolute top-8 -right-2 text-3xl opacity-20 transform rotate-12">🦋</div>
                </div>
            `;
        }

        function generateCards() {
            const namesText = document.getElementById('studentNames').value;
            const schoolName = document.getElementById('schoolName').value || 'مدرسة شعفاط الأساسية للبنات أ';
            const phoneNumber = document.getElementById('phoneNumber').value || '0547409095';
            const container = document.getElementById('cards-container');
            
            // تنظيف الأسماء من الأسطر الفارغة
            const names = namesText.split('\n').map(n => n.trim()).filter(n => n !== '');
            
            container.innerHTML = ''; // تفريغ الحاوية

            if (names.length === 0) {
                // إذا لم يتم إدخال أسماء، إنشاء 8 بطاقات فارغة
                for (let i = 0; i < 8; i++) {
                    container.innerHTML += createCardHTML('', schoolName, phoneNumber);
                }
            } else {
                // إنشاء بطاقة لكل اسم
                names.forEach(name => {
                    container.innerHTML += createCardHTML(name, schoolName, phoneNumber);
                });
            }
        }

        // إنشاء بطاقات مبدئية عند تحميل الصفحة
        window.onload = generateCards;
    </script>
</body>
</html>
