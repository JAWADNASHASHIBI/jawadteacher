<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="copyright" content="(c) Jawad Nashashibi - CC BY-NC 4.0 - not for sale">

    <meta charset="UTF-8">
    <title>اختبار الحاسوب التفاعلي</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; }
        .quiz-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .question-block { border-bottom: 1px solid #ddd; margin-bottom: 20px; padding-bottom: 10px; }
        h1 { color: #2c3e50; }
        .options { color: #555; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1 id="quiz-title">جاري تحميل الاختبار...</h1>
        <p>المعلم: <span id="teacher-name"></span></p>
        <div id="questions-area"></div>
    </div>

    <script>
        // 1. جلب بيانات JSON
        fetch('./data.json')
            .then(response => response.json())
            .then(data => {
                // 2. عرض العناوين
                document.getElementById('quiz-title').innerText = data.quiz_title;
                document.getElementById('teacher-name').innerText = data.teacher_name;

                const questionsArea = document.getElementById('questions-area');

                // 3. التكرار (Loop) لعرض كل سؤال
                data.questions.forEach(q => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'question-block';
                    
                    qDiv.innerHTML = `
                        <h3>${q.id}. ${q.question_text}</h3>
                        <div class="options">
                            ${q.options.map(opt => `<label><input type="radio" name="q${q.id}"> ${opt}</label><br>`).join('')}
                        </div>
                    `;
                    questionsArea.appendChild(qDiv);
                });
            })
            .catch(error => console.error('خطأ في تحميل البيانات:', error));
    </script>
</body>
</html>
